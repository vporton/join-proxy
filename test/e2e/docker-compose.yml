services:
    main:
        build:
            context: ../..
            dockerfile: test/e2e/Dockerfile
        depends_on:
            - db
        environment:
            DATABASE_URL: postgres://test:123@db/proxy
    db:
        image: postgres:18
        restart: always
        # entrypoint: postgres /usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/main -c config_file=/etc/postgresql/18/main/postgresql.conf
        environment:
            POSTGRES_USER: test
            POSTGRES_DB: proxy
            POSTGRES_PASSWORD: 123
            POSTGRES_HOST_AUTH_METHOD: trust
