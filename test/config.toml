# Simple Bearer authentication. On IC platform you should use callback authentication instead.
#our_secret = "<KEY>"

db = "postgres://test:123@localhost/proxy"

require_x_principal = false

frontend_origin = "http://localhost:5173"

[bind_proxy]
host = "localhost"
port = 8443

[bind_api]
host = "localhost"
port = 8000

[cache]
cache_timeout = "1m" # How long responses are cached. See for format: https://chatgpt.com/share/4fb8f7c9-ad48-4cfe-a875-efcb6d36bbf1

[upstream_timeouts]
connect_timeout = "20s"
read_timeout = "30s"
total_timeout = "60s"

# FIXME
[callback]
ic_local = true
ic_url = "http://127.0.0.1:8080" # "http://localhost:8080"
canister = "aaaaa-aa" # will be overwritten
func = "checkRequest"
